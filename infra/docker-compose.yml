
services:
  postgres:
    image: postgres:15-alpine
    container_name: happy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ✅ 운영에서는 외부 포트 노출 불필요(보안/실수 방지)
    # ports:
    #   - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nursing-home-net

  redis:
    image: redis:7-alpine
    container_name: happy_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # ✅ 운영에서는 외부 포트 노출 불필요
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - nursing-home-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: happy_backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # ✅ Docker 네트워크 호스트명 postgres
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0

      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

      # ✅ 예: https://www.행복한요양원녹양역.com,https://admin.행복한요양원녹양역.com
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: ${ENVIRONMENT:-production}

      # ✅ 운영에서는 자동 시드 비활성 권장 (초기 1회만 수동 실행)
      RUN_SEED: ${RUN_SEED:-false}

      # ✅ Cloudflare R2 — 업로드(앨범·인수인계 사진·공지/소식 이미지·지출 증빙) 저장소.
      #    비워두면 컨테이너 로컬 uploads/ 로 폴백 (개발용). 값은 infra/.env 에서.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-happy-nursing-home-albums}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

      # ✅ FCM(푸시) — 서비스계정 JSON. 이 두 줄이 없으면 모든 푸시가 조용히 비활성화된다.
      #    서버에 파일 배치: /opt/happy/infra/secrets/fcm-service-account.json
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-/app/secrets/fcm-service-account.json}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      # FCM 서비스계정 (없으면 푸시만 꺼지고 서버는 정상 기동)
      - ./secrets:/app/secrets:ro

    # ✅ 운영에서는 외부로 8000 노출 불필요 (Caddy가 프록시)
    expose:
      - "8000"

    # healthcheck: curl 없는 이미지면 실패 가능 → wget 방식 권장
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - nursing-home-net

  # ── AI 페이지 편집기 — 편집 에이전트 ────────────────────────────
  # Admin 에서 접수한 수정 요청을 실제로 수행한다.
  # 백엔드와 갈라 둔 이유: 이 컨테이너에는 git·node·gh·Claude CLI 가 들어간다.
  # 웹에서 닿는 API 프로세스가 그 도구들을 쥐고 있으면 사고 한 번이 저장소 전체다.
  #
  # 끄고 싶으면 이 서비스만 내리면 된다 — 나머지 서비스는 이것을 필요로 하지 않는다.
  #   docker compose stop ai-editor
  ai-editor:
    build:
      context: ../apps/ai-editor-agent
      dockerfile: Dockerfile
    container_name: happy_ai_editor
    restart: unless-stopped
    environment:
      # 컨테이너 안에서는 도메인을 돌아 나가지 않고 백엔드로 바로 간다
      AI_EDITOR_SERVER_URL: ${AI_EDITOR_SERVER_URL:-http://backend:8000}
      AI_EDITOR_REPO_URL: ${AI_EDITOR_REPO_URL}
      AI_EDITOR_ENROLL_CODE: ${AI_EDITOR_ENROLL_CODE:-}
      AI_EDITOR_AGENT_ID: ${AI_EDITOR_AGENT_ID:-vps-1}
      AI_EDITOR_AGENT_NAME: ${AI_EDITOR_AGENT_NAME:-운영 서버}
      # 미리보기는 포트 하나만 쓴다 — Caddy 가 이 포트만 바라본다
      AI_EDITOR_PREVIEW_PORT: "4310"
      AI_EDITOR_PREVIEW_BASE: ${AI_EDITOR_PREVIEW_BASE:-}
      # Claude 가 코드를 고치려면 이 키가 필요하다
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # PR 을 만들려면 필요하다. 없으면 수정·검증까지만 된다
      GH_TOKEN: ${GH_TOKEN:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-AI 페이지 편집기}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-ai-editor@happy.local}
    volumes:
      - ai_editor_repo:/repo      # 저장소 클론 — 다시 만들어도 남는다
      - ai_editor_work:/work      # worktree 가 생기는 자리
      - ai_editor_data:/data      # 등록 토큰
    # 2 vCPU / 4GB 짜리 서버다. 빌드가 메모리를 다 먹으면 백엔드까지 같이 죽는다.
    # 편집 작업이 느려지는 편이, 어르신 화면이 멈추는 것보다 낫다.
    mem_limit: 2g
    cpus: 1.5
    depends_on:
      - backend
    networks:
      - nursing-home-net

  caddy:
    image: caddy:2.7-alpine
    container_name: happy_caddy
    restart: unless-stopped
    ports:
      # ✅ 운영: 자동 HTTPS 필수
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # ✅ Caddy에서 ACME/TLS 쓸 때 이메일 추천(선택)
      - ACME_AGREE=true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

      # ✅ 운영 안정성: admin dist는 고정 경로 권장
      # VPS에서 /opt/happy/admin-dist 로 두고 여기 마운트
      - ${ADMIN_DIST_PATH:-/opt/happy/admin-dist}:/srv/admin:ro

      # ✅ 로그 디렉토리(선택): Caddyfile에서 /data/logs 쓰면 자동 생성되긴 함
      # - ./logs:/data/logs
    depends_on:
      - backend
    networks:
      - nursing-home-net

volumes:
  ai_editor_repo:
  ai_editor_work:
  ai_editor_data:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:
  caddy_data:
  caddy_config:

networks:
  nursing-home-net:
    driver: bridge
