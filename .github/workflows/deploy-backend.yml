name: Deploy Backend to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  check:
    # 배포 전에 러너에서 잡을 수 있는 것은 먼저 잡는다 (의존성 설치 없이 도는 검사만)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 문법 전수 검사
        run: python3 -m compileall -q backend/app backend/alembic/versions
      - name: 마이그레이션 head가 하나인지 검사
        # head가 갈라지면 alembic upgrade가 서버에서 실패한다 — 미리 잡는다
        run: |
          python3 - <<'EOF'
          import os, re
          d = "backend/alembic/versions"; revs = {}; downs = set()
          for f in os.listdir(d):
              if not f.endswith(".py"): continue
              s = open(os.path.join(d, f), encoding="utf-8").read()
              r = re.search(r"^revision(?::\s*str)?\s*=\s*['\"]([^'\"]+)", s, re.M)
              dn = re.search(r"^down_revision(?::[^=]+)?\s*=\s*(\(.*?\)|['\"][^'\"]+['\"]|None)", s, re.M | re.S)
              if r: revs[r.group(1)] = f
              if dn: downs.update(re.findall(r"['\"]([^'\"]+)['\"]", dn.group(1)))
          heads = [r for r in revs if r not in downs]
          print("heads:", heads)
          assert len(heads) == 1, f"head가 {len(heads)}개: {heads}"
          EOF

  deploy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS (pull + compose up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/happy

            # 최신 코드 가져오기
            git fetch origin main
            git reset --hard origin/main

            # compose 실행 (v2)
            cd /opt/happy/infra

            # 이미지 빌드
            docker compose build backend

            # 마이그레이션을 '컨테이너 기동 전에' 한 번만 실행한다.
            # 예전에는 up 직후 exec로 또 실행해서, entrypoint의 alembic과
            # 동시에 돌며 같은 테이블을 두 번 만들다 충돌했다(pg_type unique violation).
            docker compose run --rm --no-deps backend alembic upgrade head

            # 새 컨테이너 기동 — entrypoint의 alembic은 이미 head라 즉시 통과한다
            docker compose up -d --force-recreate backend

            # 상태 확인
            docker compose ps
            docker compose logs --tail=50 backend

            # 이전 이미지 정리 — 배포할 때마다 예전 이미지가 태그 없이 남는다.
            # 이미지가 2GB 대라 몇 번만 배포해도 50GB 디스크를 잠식한다.
            # dangling(태그 없는) 것만 지우므로 돌고 있는 컨테이너는 영향 없다.
            docker image prune -f
            df -h / | tail -1

            echo "✅ Backend deployed successfully"
